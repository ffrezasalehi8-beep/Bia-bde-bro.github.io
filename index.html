<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سایت انیمه رضا</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#0a0f1c;
color:white;
}

header{
background:#111827;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:30px;
font-weight:bold;
color:#ff2d55;
}

.menu a{
color:white;
text-decoration:none;
margin:0 10px;
}

.hero{
height:400px;
background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.7)),
url("https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1600&auto=format&fit=crop");
background-size:cover;
background-position:center;
display:flex;
align-items:center;
padding:40px;
}

.hero-content{
max-width:500px;
}

.hero h1{
font-size:48px;
color:#ff2d55;
margin-bottom:10px;
}

.hero p{
margin-bottom:20px;
}

.btn{
background:#ff2d55;
padding:12px 25px;
border-radius:8px;
text-decoration:none;
color:white;
display:inline-block;
}

.section{
padding:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:#151f35;
border-radius:15px;
overflow:hidden;
}

.card img{
width:100%;
height:280px;
object-fit:cover;
}

.card h3{
padding:15px;
}

.card a{
display:block;
background:#ff2d55;
text-align:center;
padding:12px;
text-decoration:none;
color:white;
}

footer{
margin-top:40px;
background:#111827;
padding:20px;
text-align:center;
}
</style>
</head>

<body>

<header>
<div class="logo">رضا</div>

<div class="menu">
<a href="#">خانه</a>
<a href="#">انیمه‌ها</a>
<a href="#">فیلم‌ها</a>
</div>
</header>

<section class="hero">

<div class="hero-content">
<h1>Naruto Shippuden</h1>

<p>
داستان نینجایی که می‌خواهد هوکاگه شود.
</p>

<a class="btn" href="naruto.html">
مشاهده ناروتو
</a>
</div>

</section>

<section class="section">

<h2>انیمه‌های محبوب</h2>

<br>

<div class="grid">

<div class="card">
<img src="https://picsum.photos/300/400?1">
<h3>Naruto</h3>
<a href="naruto.html">مشاهده</a>
</div>

<div class="card">
<img src="https://picsum.photos/300/400?2">
<h3>One Piece</h3>
<a href="#">به زودی</a>
</div>

<div class="card">
<img src="https://picsum.photos/300/400?3">
<h3>Demon Slayer</h3>
<a href="#">به زودی</a>
</div>

<div class="card">
<img src="https://picsum.photos/300/400?4">
<h3>Attack On Titan</h3>
<a href="#">به زودی</a>
</div>

</div>

</section>

<footer>
© سایت فیلم و انیمه رضا
</footer>

</body>
</html>
